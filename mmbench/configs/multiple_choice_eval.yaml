api_base: local_swift_engine

base_model: ../models/Qwen3-VL-4B-Instruct
adapters: []

dataset_path: ../data/fgvqa/test-00000-of-00001.parquet
work_dir: ../outputs/tool_eval_multiple_choice

with_tools: true
